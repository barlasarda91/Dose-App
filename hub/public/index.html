<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dose Hub · Boxx Coffee Roasters Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1A1916; --graphite:#3D3A34; --drift:#7A7268; --linen:#B8AFA3;
  --stone:#DDD6CC; --parch:#F5EFE3; --olive:#6B6E4A; --warn:#C4833A; --red:#8B2E2E;
  --serif:'Libre Baskerville',serif; --mono:'IBM Plex Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--mono);font-weight:300;background:var(--parch);color:var(--ink);font-size:14px;line-height:1.7}
.nav{position:sticky;top:0;z-index:10;background:var(--parch);border-bottom:1px solid var(--linen);height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:var(--serif);font-size:13px}
.nav-links{display:flex;gap:24px;list-style:none}
.nav-link{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--drift);cursor:pointer}
.nav-link:hover,.nav-link.active{color:var(--ink)}
.page{max-width:1180px;margin:0 auto;padding:36px 32px 80px}
.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.title{font-family:var(--serif);font-size:30px;font-weight:400;margin-bottom:4px}
.sub{font-size:12px;color:var(--drift);margin-bottom:24px}
.rule{border:none;border-top:1px solid var(--linen);margin-bottom:24px}
.section{margin-bottom:34px}
.section-title{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--drift);padding-bottom:10px;border-bottom:1px solid var(--linen);margin-bottom:14px}
.btn{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:9px 18px;border:none;cursor:pointer;border-radius:0;white-space:nowrap;background:var(--ink);color:var(--parch)}
.btn:hover{background:var(--graphite)}
.btn:disabled{background:var(--linen);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--parch)}
.btn-sm{font-size:8px;padding:5px 10px;background:transparent;color:var(--graphite);border:1px solid var(--linen)}
.btn-sm:hover{border-color:var(--graphite);background:transparent;color:var(--ink)}
input,select{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--parch);border:1px solid var(--linen);padding:8px 12px;outline:none;border-radius:0}
input:focus,select:focus{border-color:var(--drift);outline:2px solid var(--olive);outline-offset:2px}
.table-wrap{border:1px solid var(--linen);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--drift);background:var(--stone);padding:10px 12px;border-bottom:1px solid var(--linen);text-align:left;white-space:nowrap;font-weight:400}
td{padding:10px 12px;border-bottom:1px solid var(--linen);color:var(--graphite);vertical-align:middle}
tr:last-child td{border-bottom:none}
.status{display:inline-block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--linen);padding:3px 8px}
.status.new{color:var(--warn);border-color:var(--warn)}
.status.confirmed{color:var(--olive);border-color:var(--olive)}
.status.delivered{color:var(--drift)}
.card{background:var(--parch);border:1px solid var(--linen);padding:20px;margin-bottom:14px}
.empty{font-size:11px;color:var(--linen);padding:36px 0}
.err{font-size:11px;color:var(--red);margin-top:8px}
.ok{font-size:11px;color:var(--olive);margin-top:8px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:320px;background:var(--parch);border:1px solid var(--linen);padding:36px 32px}
.login-title{font-family:var(--serif);font-size:28px}
.login-sub{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--drift);margin-bottom:22px}
.lbl{display:block;font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--drift);margin-bottom:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.stat-name{font-family:var(--serif);font-size:16px;margin-bottom:8px}
.stat-line{font-size:10px;color:var(--drift);line-height:1.8}
.bars{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:12px;border-bottom:1px solid var(--linen);padding-bottom:1px}
.bars>div{flex:1;background:var(--olive);min-height:2px}
.keybox{background:var(--stone);border:1px solid var(--warn);padding:14px 16px;margin:12px 0;font-size:11px;word-break:break-all;line-height:1.8}
.num{text-align:right;white-space:nowrap}
.roast-lbl{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--drift);border:1px solid var(--linen);padding:1px 4px;margin-right:4px}
.badge{display:inline-block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--linen);padding:2px 7px;color:var(--drift);margin-left:8px;vertical-align:middle}
.badge.seasonal{color:var(--olive);border-color:var(--olive)}
.badge.low{color:var(--warn);border-color:var(--warn)}
.pool-mix{display:flex;height:8px;border:1px solid var(--linen);margin-top:10px;overflow:hidden}
.pool-mix>div{height:100%}
.legend{display:flex;gap:12px;font-size:9px;color:var(--drift);margin-top:6px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;margin-right:4px}
@media(max-width:640px){.page{padding:24px 16px 60px}.nav{padding:0 16px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
